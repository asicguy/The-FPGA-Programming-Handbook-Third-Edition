# Vitis HLS component configuration for the CH12 video filter.
#
# This is the unified Vitis flow -- there is no vitis_hls executable any more.
# Build it with the driver script one directory up:
#
#     ./build_hls.sh
#
# or step by step, from the CH12/HLS directory:
#
#     vitis-run --mode hls --csim    --config video_filter/hls_config.cfg --work_dir video_filter
#     v++ -c     --mode hls          --config video_filter/hls_config.cfg --work_dir video_filter
#     vitis-run --mode hls --cosim   --config video_filter/hls_config.cfg --work_dir video_filter
#     vitis-run --mode hls --package --config video_filter/hls_config.cfg --work_dir video_filter
#
# or open CH12/HLS as a workspace in the Vitis IDE (`vitis -w .`), which reads
# this file plus vitis-comp.json alongside it.
part=xczu3eg-sfvc784-2-e

[hls]
flow_target=vivado

# 5 ns, matching CH11. The accelerator is DDR-bound at one pixel per beat, not
# Fmax-bound -- CH11 measured all three of its implementations at ~92% of the
# theoretical 200 Mpixel/s -- so there is nothing to buy by clocking it faster.
clock=5ns
clock_uncertainty=12.5%

syn.top=video_filter
syn.file=../src/video_filter.cpp
syn.cflags=-I../src

tb.file=../src/tb_video_filter.cpp
tb.cflags=-I../src

cosim.rtl=verilog
cosim.trace_level=none

# Package for the Vivado IP catalog. package.output.syn=false keeps the export
# fast -- it skips the optional post-synthesis timing/area characterisation.
package.output.format=ip_catalog
package.output.syn=false
package.ip.vendor=aup
package.ip.library=hls
package.ip.version=1.0
package.ip.display_name=BGRA Gray / Sobel / Invert Video Filter
