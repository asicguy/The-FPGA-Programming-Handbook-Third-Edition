# Vitis HLS component configuration for the ZU3EG streaming Sobel filter.
#
# This is the unified Vitis flow -- there is no vitis_hls executable any more.
# Build it with the driver script one directory up:
#
#     ./build_hls.sh
#
# or step by step, from the CH12/HLS directory:
#
#     vitis-run --mode hls --csim    --config sobel_stream/hls_config.cfg --work_dir sobel_stream
#     v++ -c     --mode hls           --config sobel_stream/hls_config.cfg --work_dir sobel_stream
#     vitis-run --mode hls --cosim   --config sobel_stream/hls_config.cfg --work_dir sobel_stream
#     vitis-run --mode hls --package --config sobel_stream/hls_config.cfg --work_dir sobel_stream
part=xczu3eg-sfvc784-2-e

[hls]
flow_target=vivado

# 300 MHz -- video_aclk, which is PL1 in the block design. The filter is
# nowhere near being the bottleneck (1080p30 at two pixels per clock needs
# 31 MHz, and the 2-lane RAW10 link only feeds 67 Mpixel/s) but it shares a
# clock domain with the CSI-2 subsystem, the demosaic and the CSC, and that
# domain is 300 MHz in AMD's reference pipeline. The same 3.3 ns is what
# AUP-ZU3/base/build_hls_ip.tcl targets for pixel_pack.
clock=3.3ns
clock_uncertainty=12.5%

syn.top=sobel_stream
syn.file=../src/sobel_stream.cpp
syn.cflags=-I../src

tb.file=../src/tb_sobel_stream.cpp
tb.cflags=-I../src

cosim.rtl=verilog
cosim.trace_level=none

# Package for the Vivado IP catalog. package.output.syn=false keeps the export
# fast -- it skips the optional post-synthesis timing/area characterisation.
package.output.format=ip_catalog
package.output.syn=false
package.ip.vendor=aup
package.ip.library=hls
package.ip.version=1.0
package.ip.display_name=Streaming Sobel Video Filter
